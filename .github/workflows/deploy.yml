name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy-dev:
    name: Deploy to Development
    if: github.ref == 'refs/heads/dev'
    runs-on: [self-hosted, dev-ai]
    environment:
      name: feedback-development
      url: https://dev-feedback.vjstartup.com
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Env Files
        shell: bash
        run: |
          touch backend/.env
          touch frontend/.env
          echo "PORT=${{ secrets.PORT }}" >> backend/.env
          echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> backend/.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> backend/.env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> backend/.env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> backend/.env
          echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> backend/.env
          echo "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" >> backend/.env
          echo "GOOGLE_CALLBACK_URL=${{ secrets.GOOGLE_CALLBACK_URL }}" >> backend/.env
          echo "VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}" >> frontend/.env

      - name: Deploy using Docker Compose
        shell: bash
        run: |
          export BACKEND_PORT="${{ secrets.BACKEND_PORT }}"
          export FRONTEND_PORT="${{ secrets.FRONTEND_PORT }}"
          if [ -z "$BACKEND_PORT" ]; then export BACKEND_PORT="5001"; fi
          if [ -z "$FRONTEND_PORT" ]; then export FRONTEND_PORT="8081"; fi
          docker compose -f docker-compose.yml down
          docker compose -f docker-compose.yml up -d --build

      - name: Trigger / Verify Dev URL
        run: |
          echo "Waiting for services to start..."
          sleep 10
          echo "Testing dev URL..."
          curl -sI https://dev-feedback.vjstartup.com | head -n 1

  deploy-prod:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, gamma]
    environment:
      name: feedback-production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Env Files
        shell: bash
        run: |
          touch backend/.env
          touch frontend/.env
          echo "PORT=${{ secrets.PORT }}" >> backend/.env
          echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> backend/.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> backend/.env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> backend/.env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> backend/.env
          echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> backend/.env
          echo "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" >> backend/.env
          echo "GOOGLE_CALLBACK_URL=${{ secrets.GOOGLE_CALLBACK_URL }}" >> backend/.env
          echo "VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}" >> frontend/.env

      - name: Deploy using Docker Compose
        shell: bash
        run: |
          export BACKEND_PORT="${{ secrets.BACKEND_PORT }}"
          export FRONTEND_PORT="${{ secrets.FRONTEND_PORT }}"
          if [ -z "$BACKEND_PORT" ]; then export BACKEND_PORT="5000"; fi
          if [ -z "$FRONTEND_PORT" ]; then export FRONTEND_PORT="80"; fi
          docker compose -f docker-compose.yml down
          docker compose -f docker-compose.yml up -d --build
